services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: helpdesk-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-support}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-support}
      POSTGRES_DB: ${POSTGRES_DB:-support}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-support} -d ${POSTGRES_DB:-support}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    container_name: helpdesk-backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-1440}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-support}:${POSTGRES_PASSWORD:-support}@postgres:5432/${POSTGRES_DB:-support}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      ADMIN_NAME: ${ADMIN_NAME:-Support Admin}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      DEMO_WORKSPACE_NAME: ${DEMO_WORKSPACE_NAME:-Acme Support}
      AUTO_RESET_SCHEMA: ${AUTO_RESET_SCHEMA:-false}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      WORKER_API_KEY: ${WORKER_API_KEY:-dev-worker-key}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-700}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-4}
      RETRIEVAL_MIN_SCORE: ${RETRIEVAL_MIN_SCORE:-0.05}
      AUTO_REPLY_MIN_SCORE: ${AUTO_REPLY_MIN_SCORE:-0.5}
      CHANNEL_API_KEY: ${CHANNEL_API_KEY:-dev-channel-key}
      TELEGRAM_WORKER_ENABLED: ${TELEGRAM_WORKER_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build: ./frontend
    container_name: helpdesk-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"

  telegram-bot:
    build: ./bots/telegram
    container_name: helpdesk-telegram
    profiles: ["bots"]
    environment:
      BACKEND_URL: http://backend:8000
      WORKER_API_KEY: ${WORKER_API_KEY:-dev-worker-key}
      CHANNEL_API_KEY: ${CHANNEL_API_KEY:-dev-channel-key}
      ASSIGNMENT_REFRESH_SECONDS: ${ASSIGNMENT_REFRESH_SECONDS:-20}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
